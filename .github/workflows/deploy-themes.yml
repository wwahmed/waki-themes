name: deploy-themes

# Auto-deploy waki-themes to two Cloudflare Pages projects on every push to main:
#   - app/dist  -> waki-themes-studio (themes.wakilabs.dev)
#   - dist/cdn  -> wakilabs-cdn       (cdn.wakilabs.dev)
#
# Both Pages projects are Direct Upload type. This workflow is the deploy
# mechanism. Root has no npm deps; the studio app has its own lockfile under
# `app/`. Build sequence: bundle -> studio.
#
# Speed optimizations:
#   - paths filter limits triggers to source code, build scripts, and the
#     workflow itself.
#   - npm cache + Vite cache shave most of the build time off warm runs.
#   - concurrency.cancel-in-progress cancels older runs mid-deploy when a
#     newer push lands.

on:
  push:
    branches: [main]
    paths:
      - "src/themes/**"
      - "styles/**"
      - "scripts/**"
      - "app/**"
      - "package.json"
      - ".github/workflows/deploy-themes.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-themes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache Vite build outputs (studio)
        uses: actions/cache@v4
        with:
          path: |
            app/node_modules/.vite
            app/.vite-cache
          key: vite-studio-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-${{ hashFiles('app/src/**/*', 'src/themes/**/*', 'styles/**/*') }}
          restore-keys: |
            vite-studio-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-
            vite-studio-

      - name: Build bundle (root, no deps; node-only)
        run: node scripts/build-bundle.mjs

      - name: Install studio deps
        working-directory: app
        run: npm ci --prefer-offline --no-audit

      - name: Sync bundle into studio + build studio
        working-directory: app
        run: |
          npm run sync-bundle
          npm run build

      - name: Deploy app/dist to waki-themes-studio (themes.wakilabs.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf "%s" "$COMMIT_SUBJECT" | head -1 | tr -d '\r')
          npx --yes wrangler@4 pages deploy app/dist \
            --project-name=waki-themes-studio \
            --branch=main \
            --commit-dirty=true \
            --commit-hash=${{ github.sha }} \
            --commit-message="$SUBJECT"

      - name: Deploy dist/cdn to wakilabs-cdn (cdn.wakilabs.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf "%s" "$COMMIT_SUBJECT" | head -1 | tr -d '\r')
          npx --yes wrangler@4 pages deploy dist/cdn \
            --project-name=wakilabs-cdn \
            --branch=main \
            --commit-dirty=true \
            --commit-hash=${{ github.sha }} \
            --commit-message="$SUBJECT"
